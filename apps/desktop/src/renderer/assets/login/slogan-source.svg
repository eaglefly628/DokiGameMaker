  <text x="150" y="112" font-family="DejaVu Sans, sans-serif" font-style="italic"
        font-weight="bold" font-size="42" letter-spacing="0.5" fill="{{INK}}">Create it.</text>
  <!-- 科技感强调点 -->
  <circle cx="132" cy="98" r="7" fill="url(#sacc)"/>
