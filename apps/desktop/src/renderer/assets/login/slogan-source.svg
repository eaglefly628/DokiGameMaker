<svg width="455" height="131" viewBox="0 0 455 131" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sacc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <!-- Slogan：Dream it. Create it. 清爽科技体，两行错位 -->
